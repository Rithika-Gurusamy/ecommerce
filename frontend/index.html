<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <nav>
        <h2>My Store</h2>
        <button id="toggle-orders-btn" onclick="toggleOrders()">My Orders</button>
    </nav>

    <main class="container">

        <section id="products-section">
            <h2>Available Products</h2>
            <div class="product-grid" id="product-container">
            </div>
        </section>

        <section id="orders-section" class="hidden">
            <h2>My Orders</h2>
            <div id="orders-container">
                <p class="empty-msg">No orders yet.</p>
            </div>
        </section>

    </main>

    <!-- ── Chat Widget ─────────────────────────────────────────── -->

    <!-- Floating chat toggle button -->
    <button id="chat-fab" onclick="toggleChat()" title="Chat with assistant">
        <svg id="chat-fab-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <svg id="chat-fab-close" class="hidden" xmlns="http://www.w3.org/2000/svg" width="28" height="28"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- Chat window -->
    <div id="chat-window" class="hidden">

        <div id="chat-header">
            <div id="chat-header-info">
                <span id="chat-avatar">🤖</span>
                <div>
                    <strong>Store Assistant</strong>
                    <small>Online</small>
                </div>
            </div>
            <button id="chat-close-btn" onclick="toggleChat()" title="Close chat">✕</button>
        </div>

        <div id="chat-messages">
            <!-- Welcome message injected by JS -->
        </div>

        <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Ask me anything..."
                autocomplete="off" onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="chat-send-btn" onclick="sendMessage()" title="Send">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>

    </div>

</body>

</html>
